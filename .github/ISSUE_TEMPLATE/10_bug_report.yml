name: Report a bug
description: Report an EVB IDE bug.
body:
  - type: markdown
    attributes:
      value: |
        Please report EVB IDE issues here. Keep private code, credentials, and personal data out of public reports.
  - type: textarea
    attributes:
      label: Reproduction steps
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: EVB IDE version and system information
      description: Include the version from About EVB IDE and your operating system and architecture.
    validations:
      required: true
