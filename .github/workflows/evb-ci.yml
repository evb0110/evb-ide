name: EVB CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm --dir landing install --frozen-lockfile
      - run: pnpm --dir landing run typecheck
      - run: pnpm --dir landing test
      - run: pnpm --dir landing run build
  packaging-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n script/evb-install script/evb-release script/evb-deploy-landing script/evb-sync-upstream script/evb-ci-macos-signing script/generate-licenses
      - run: script/check-licenses
