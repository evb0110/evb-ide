name: EVB Release

# Builds the release on GitHub runners, so releases need no local release build: the macOS app
# signed and notarized by script/evb-release, the Linux archive by script/evb-bundle-linux and the
# Windows archive by script/evb-bundle-windows.ps1.
# A v* tag publishes the release; a manual run builds and uploads the artifacts, and publishes
# only when asked.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release after the build
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: evb-release
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          # Publishing checks that the commit is on origin/main.
          fetch-depth: 0

      - name: Check the tag matches EVB_VERSION
        if: github.ref_type == 'tag'
        run: test "v$(tr -d '\n' < EVB_VERSION)" = "$GITHUB_REF_NAME"

      # Every release bumps EVB_VERSION, so a published version is never rebuilt with other content.
      - name: Check EVB_VERSION is newer than the latest release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\n' < EVB_VERSION)"
          latest="$(gh release view --repo evb0110/evb-ide --json tagName --jq '.tagName | ltrimstr("v")')"
          if [[ "$version" == "$latest" || "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "EVB_VERSION $version must be newer than the latest release $latest: bump the patch number." >&2
            exit 1
          fi

      - name: Free disk space
        run: |
          df -h /
          # A release build needs about 40 GB: keep only the selected Xcode.
          selected="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          for app in /Applications/Xcode*.app; do
            [[ "$(cd "$app" && pwd -P)" == "$selected" ]] || sudo rm -rf "$app"
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" \
            /Library/Developer/CoreSimulator/Volumes "$HOME/Library/Developer/CoreSimulator" \
            "$RUNNER_TOOL_CACHE/CodeQL" "$RUNNER_TOOL_CACHE/PyPy" "$RUNNER_TOOL_CACHE/Ruby" || true
          df -h /

      - name: Install build tools
        run: |
          xcodebuild -version
          if ! xcrun --find metal > /dev/null 2>&1 || ! xcrun metal --version > /dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          command -v cmake > /dev/null || brew install cmake
          rustup show active-toolchain || rustup toolchain install

      - name: Set up signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: script/evb-ci-macos-signing

      - name: Build, sign and notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: script/evb-release

      - name: Upload the release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evb-ide-macos-arm64
          path: .devkit/releases/
          # The release directory lives under the ignored .devkit folder.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${EVB_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$EVB_SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  linux-x64:
    # The oldest supported runner: its glibc decides which distributions can run the build.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: /mnt/evb-target
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$CARGO_TARGET_DIR" && sudo chown "$USER" "$CARGO_TARGET_DIR"
          df -h / /mnt

      - name: Install build dependencies
        run: |
          sudo script/linux
          # WebRTC needs clang 17 or newer; Ubuntu 22.04 ships clang 14.
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 18
          sudo apt-get install -y llvm python3-pil

      - name: Build the archive
        env:
          CC: clang-18
          CXX: clang++-18
          LLD: /usr/bin/ld.lld-18
        run: |
          # The bundle script reads target/; the build lives on the larger /mnt disk.
          ln -s "$CARGO_TARGET_DIR" target
          script/evb-bundle-linux

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: evb-ide-linux-x64
          path: target/evb-bundle/EVB-IDE-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # D: has more room than C: on Windows runners.
      CARGO_TARGET_DIR: D:\evb-target
    steps:
      - uses: actions/checkout@v4

      - name: Build the archive
        shell: pwsh
        run: |
          rustup show active-toolchain
          script/evb-bundle-windows.ps1

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: evb-ide-windows-x64
          path: target/evb-bundle/EVB-IDE-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag' || inputs.publish
    needs: [macos-arm64, linux-x64, windows-x64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # script/evb-release checks that the commit is on origin/main.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: evb-ide-macos-arm64
          path: .devkit/releases

      - uses: actions/download-artifact@v4
        with:
          name: evb-ide-linux-x64
          # Outside the checkout: script/evb-release needs a clean working tree.
          path: ${{ runner.temp }}/linux-artifact

      - uses: actions/download-artifact@v4
        with:
          name: evb-ide-windows-x64
          path: ${{ runner.temp }}/windows-artifact

      - name: Add the Linux and Windows archives to the release
        run: |
          version="$(tr -d '\n' < EVB_VERSION)"
          output=".devkit/releases/v$version"
          linux="EVB-IDE-$version-linux-x64.tar.gz"
          windows="EVB-IDE-$version-windows-x64.zip"
          mv "$RUNNER_TEMP/linux-artifact/$linux" "$RUNNER_TEMP/windows-artifact/$windows" "$output/"
          (cd "$output" && shasum -a 256 "$linux" "$windows" >> SHA256SUMS)
          linux_line="- Linux x64 (glibc 2.35 or later): extract the archive and run install.sh in it."
          windows_line="- Windows 10 or later, x64: extract the archive and run evb-ide.exe. The Windows build is not code-signed, so SmartScreen may ask before it first runs."
          awk -v linux="$linux_line" -v windows="$windows_line" \
            '!done && /^- Open the DMG/ { print linux; print windows; done = 1 } { print }' \
            "$output/RELEASE-NOTES.md" > "$output/RELEASE-NOTES.new"
          mv "$output/RELEASE-NOTES.new" "$output/RELEASE-NOTES.md"
          grep -qF "Windows 10 or later" "$output/RELEASE-NOTES.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: script/evb-release --publish
